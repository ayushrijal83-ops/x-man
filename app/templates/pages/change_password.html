{% extends "base.html" %}

{% block title %}Change Password - NepalSathi{% endblock %}

{% block content %}
{% include "components/navbar.html" %}

<div class="container">
    <h1><i data-lucide="lock"></i> Change Password</h1>
    
    <div class="card" style="max-width: 500px; margin: 2rem auto;">
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div class="form-group">
                <label>Current Password</label>
                <input type="password" name="current_password" class="form-input" required>
            </div>
            
            <div class="form-group">
                <label>New Password</label>
                <input type="password" name="new_password" class="form-input" required minlength="6">
            </div>
            
            <div class="form-group">
                <label>Confirm New Password</label>
                <input type="password" name="confirm_password" class="form-input" required minlength="6">
            </div>
            
            <button type="submit" class="btn btn-primary btn-block">Change Password</button>
        </form>
        
        <hr style="margin: 2rem 0;">
        
        <a href="/profile/edit" class="btn btn-outline btn-block"><i data-lucide="arrow-left"></i> Back to Edit Profile</a>
    </div>
</div>
{% endblock %}
