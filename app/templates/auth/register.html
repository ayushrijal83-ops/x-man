{% extends "base.html" %}

{% block title %}Create account - NepalSathi{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div style="display:flex; justify-content:center; align-items:center; gap:8px; margin-bottom:1rem;">{% include "components/lang_selector.html" %}<button type="button" class="theme-toggle" aria-label="Switch to dark mode" aria-pressed="false"><i data-lucide="moon"></i></button></div>
        <h2 class="auth-title">Create Account</h2>
        <p class="auth-subtitle">Join your district on NepalSathi</p>
        
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required 
                       class="form-input" placeholder="Choose a username">
            </div>
            
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required 
                       class="form-input" placeholder="Enter your email">
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required 
                       class="form-input" placeholder="Create a password" minlength="6">
            </div>
            
            <button type="submit" class="btn btn-primary btn-block">
                Register
            </button>
        </form>
        
        <p class="auth-footer">
            Already have an account? 
            <a href="/auth/login">Login here</a>
        </p>
    </div>
</div>
{% endblock %}
