{% extends "base.html" %}

{% block title %}Authority Login - NepalSathi{% endblock %}

{% block content %}
<div class="auth-container" style="background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);">
    <div class="auth-card" style="max-width: 450px;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div style="font-size: 3rem; margin-bottom: 1rem;">🏛️</div>
            <h2 class="auth-title" style="color: #1a1a2e;">Authority Login</h2>
            <p class="auth-subtitle">Government & Organization Access</p>
        </div>
        
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div class="form-group">
                <label for="username" style="font-weight: 600;">Username</label>
                <input type="text" id="username" name="username" required 
                       class="form-input" placeholder="Enter authority username"
                       style="border: 2px solid #1a1a2e;">
            </div>
            
            <div class="form-group">
                <label for="password" style="font-weight: 600;">Password</label>
                <input type="password" id="password" name="password" required 
                       class="form-input" placeholder="Enter password"
                       style="border: 2px solid #1a1a2e;">
            </div>
            
            <div class="form-check">
                <input type="checkbox" id="remember" name="remember">
                <label for="remember">Remember me</label>
            </div>
            
            <button type="submit" class="btn btn-block" 
                    style="background: #1a1a2e; color: white; padding: 0.75rem; font-size: 1.1rem; font-weight: 600;">
                Login to Authority Panel
            </button>
        </form>
        
        <div style="margin-top: 1.5rem; text-align: center;">
            <p style="margin-bottom: 0.5rem;">
                <a href="/auth/authority/register" style="color: #1a1a2e; font-weight: 600; text-decoration: none;">
                    Register as Authority
                </a>
            </p>
            <p style="margin-top: 0.5rem;">
                <a href="/auth/login" style="color: #6b7280; text-decoration: none;">
                    ← Citizen Login
                </a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
