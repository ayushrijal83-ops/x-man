{% extends "base.html" %}

{% block title %}Sign in - NepalSathi{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div style="display:flex; justify-content:center; align-items:center; gap:8px; margin-bottom:1rem;">{% include "components/lang_selector.html" %}<button type="button" class="theme-toggle" aria-label="Switch to dark mode" aria-pressed="false"><i data-lucide="moon"></i></button></div>
        <h2 class="auth-title">Welcome Back</h2>
        <p class="auth-subtitle">Login to continue to your dashboard</p>
        
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required 
                       class="form-input" placeholder="Enter your username">
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required 
                       class="form-input" placeholder="Enter your password">
            </div>
            
            <div class="form-check">
                <input type="checkbox" id="remember" name="remember">
                <label for="remember">Remember me</label>
            </div>
            
            <button type="submit" class="btn btn-primary btn-block">
                Login
            </button>
        </form>
        
        <p class="auth-footer">
            Don't have an account? 
            <a href="/auth/register">Register here</a>
        </p>
    </div>
</div>
{% endblock %}
